<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your situation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1A73E8}a:hover{color:#1557B0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #16181D; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F5F7; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #ECEDF1; overflow: hidden"><div style="width: 40%; height: 4px; background: #1A73E8"></div></div>
    <span style="font-size: 13px; font-weight: 500; color: #5F6475">2 of 5</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5F6475">YOUR COACH</span>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Which best fits your situation?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5F6475">No judgement. This just helps set targets you can actually hit.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600">{{q.q}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F4F5F7">
          <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="3">
            <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}">
              <button onClick="{{o.pick}}" aria-pressed="true" style="min-height: 44px; padding: 0 6px; border-radius: 9px; border: 0; background: #FFFFFF; box-shadow: 0 1px 3px rgba(22, 24, 29, 0.12); color: #16181D; font-size: 13px; font-weight: 600; cursor: pointer">{{o.label}}</button>
            </sc-if>
            <sc-if value="{{o.off}}" hint-placeholder-val="{{true}}">
              <button onClick="{{o.pick}}" aria-pressed="false" style="min-height: 44px; padding: 0 6px; border-radius: 9px; border: 0; background: transparent; color: #5F6475; font-size: 13px; font-weight: 500; cursor: pointer">{{o.label}}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Connect.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1A73E8; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pay: 'Monthly', month: 'Tight', savings: 'None', debt: 'Card/overdraft' };
  }
  renderVals() {
    const qs = [
      { id: 'pay', q: 'How are you paid?', opts: ['Monthly', 'Weekly', 'Irregular'] },
      { id: 'month', q: 'How is this month feeling?', opts: ['Comfortable', 'Tight', 'Struggling'] },
      { id: 'savings', q: 'Savings right now?', opts: ['None', 'Under £500', '£500+'] },
      { id: 'debt', q: 'Any debt?', opts: ['None', 'Card/overdraft', 'Loans'] }
    ];
    return {
      questions: qs.map((q) => ({
        q: q.q,
        opts: q.opts.map((label) => ({
          label: label,
          on: this.state[q.id] === label,
          off: this.state[q.id] !== label,
          pick: () => this.setState({ [q.id]: label })
        }))
      }))
    };
  }
}
</script>
</body>
</html>
