<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1A73E8}a:hover{color:#1557B0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #16181D; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="Anomalies.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F5F7; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #ECEDF1; overflow: hidden"><div style="width: 100%; height: 4px; background: #1A73E8"></div></div>
    <span style="font-size: 13px; font-weight: 500; color: #5F6475">5 of 5</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #5F6475">BUILT BY YOUR AI COACHING TEAM</span>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">3 ways to handle your red zones</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5F6475">Pick the one that sounds most like you. You can switch any time.</p>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #FFF4EC">
    <svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true" style="flex-shrink: 0"><path d="M1 5h24" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"></path></svg>
    <span style="font-size: 13px; line-height: 1.4; color: #3F4350">If you keep overspending in your red zones: <strong style="color: #16181D">£1.2k in 5 years</strong></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
      <button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 14px 16px; border-radius: 16px; border: 0; background: #F4F5F7; color: #16181D; text-align: left; cursor: pointer">
        <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 16px; border: 2px solid #1A73E8; pointer-events: none"></span></sc-if>
        <span style="display: flex; align-items: center; gap: 10px; width: 100%">
          <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid #1A73E8; box-sizing: border-box; background: #FFFFFF; flex-shrink: 0"></span></sc-if>
          <sc-if value="{{p.off}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #C9CCD6; box-sizing: border-box; background: #FFFFFF; flex-shrink: 0"></span></sc-if>
          <span style="flex: 1; font-size: 17px; font-weight: 600">{{p.name}}</span>
          <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 16px; font-weight: 600">{{p.outcome}}</span><span style="font-size: 11px; color: #5F6475">in 5 years</span></span>
        </span>
        <span style="font-size: 14px; line-height: 1.45; color: #2B2E36">{{p.tagline}}</span>
        <span style="font-size: 12px; line-height: 1.5; color: #5F6475">{{p.how}}</span>
        <span style="font-size: 12px; font-weight: 500; color: #1E7B38">{{p.unlock}}</span>
      </button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Walkthrough.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1A73E8; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Go with {{chosen}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'sweep' };
  }
  renderVals() {
    const list = [
      { id: 'cap', name: 'Cap it', outcome: '£11.4k', tagline: 'A budget for every red zone, with a heads-up before each one starts.', how: 'Limits per event · warning 2 hours before', unlock: 'Emergency fund full by month 9, then growth fund unlocks' },
      { id: 'sweep', name: 'Sweep it', outcome: '£13.2k', tagline: 'Move money out of reach before a red zone arrives.', how: 'Auto-save £30 before payday weekends and big events', unlock: 'Emergency fund full by month 7, then growth fund unlocks' },
      { id: 'swap', name: 'Swap it', outcome: '£9.8k', tagline: 'Keep the plans, change what they cost.', how: 'Cheaper alternatives suggested the day before', unlock: 'Emergency fund full by month 11, then growth fund unlocks' }
    ];
    const picked = this.state.picked;
    const chosen = list.find((p) => p.id === picked);
    return {
      chosen: chosen ? chosen.name : 'this plan',
      plans: list.map((p) => ({
        name: p.name, outcome: p.outcome, tagline: p.tagline, how: p.how, unlock: p.unlock,
        on: p.id === picked,
        off: p.id !== picked,
        pressed: p.id === picked ? 'true' : 'false',
        pick: () => this.setState({ picked: p.id })
      }))
    };
  }
}
</script>
</body>
</html>
