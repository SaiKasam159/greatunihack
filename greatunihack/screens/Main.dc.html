<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { nights: true, emergency: true, invest: true } };
  }
  renderVals() {
    const ids = ['nights', 'payday', 'emergency', 'big', 'invest', 'debt'];
    const picked = this.state.picked;
    const on = {}, off = {}, p = {}, t = {};
    ids.forEach((id) => {
      on[id] = !!picked[id];
      off[id] = !picked[id];
      p[id] = picked[id] ? 'true' : 'false';
      t[id] = () => this.setState({ picked: Object.assign({}, picked, { [id]: !picked[id] }) });
    });
    return { on: on, off: off, p: p, t: t };
  }
}
</script>
